# Fail2ban filter — varredura / abuso (muitos 403/404 em pouco tempo)
# Ignora webhooks de adquirentes e login da API (403 legítimo ≠ ataque)
[Definition]
failregex = ^<HOST> -.*"(GET|POST|HEAD|PUT|DELETE|PATCH) [^"]*" (403|404)
ignoreregex = ^<HOST> -.*"(GET|POST|HEAD) /(favicon\.ico|robots\.txt)
              ^<HOST> -.*"(GET|POST|HEAD|PUT|DELETE|PATCH) /(simpay|fyhub|treeal|callback|pagarme)/
              ^<HOST> -.*"(GET|POST|HEAD|PUT|DELETE|PATCH) /api/(auth|login)
