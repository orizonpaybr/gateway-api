# /etc/nginx/snippets/gateway-security.conf — incluir dentro do server { }
#
# Upload/timeouts (client_max_body_size 50M, client_body_timeout 300s) ficam no
# server block do site gateway-api — NÃO duplicar aqui.

# Paths sensíveis — log dedicado para fail2ban (ban permanente)
location ~* ^/(\.env|\.git|wp-admin|phpmyadmin|\.aws|config\.json|\.htaccess|\.htpasswd|vendor/phpunit|actuator|telescope) {
    access_log /var/log/nginx/sensitive.log combined;
    return 444;
}

# Bloqueio de ficheiros ocultos (exceto .well-known para SSL)
location ~ /\.(?!well-known) {
    access_log /var/log/nginx/sensitive.log combined;
    deny all;
}

# Rate limit em rotas de autenticação (login, cadastro, validate-registration, 2FA…)
location ~ ^/api/auth {
    # Preflight CORS respondido direto no nginx, ANTES do rate limit. Sem isto o
    # OPTIONS leva 429/503 sem header CORS e o browser mostra "Load failed".
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        return 204;
    }
    # burst=10: tolera o pico normal de um utilizador a tentar logar algumas vezes.
    limit_req zone=login burst=10 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}

# Rate limit na API
location /api/ {
    limit_req zone=api burst=30 nodelay;
    limit_conn conn_per_ip 50;
    try_files $uri $uri/ /index.php?$query_string;
}

# Limite global de conexões por IP
limit_conn conn_per_ip 100;
limit_req zone=general burst=60 nodelay;
