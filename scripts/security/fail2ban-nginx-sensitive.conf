# Fail2ban filter — tentativas em paths sensíveis (log dedicado do Nginx)
[Definition]
failregex = ^<HOST> -.*"(GET|POST|HEAD|PUT|DELETE|PATCH|OPTIONS) .*(\.env|\.git|wp-admin|phpmyadmin|\.aws|config\.json|\.htaccess|\.htpasswd|/vendor/phpunit|/actuator|/telescope|/horizon)[^"]*" (403|404|444|400)
ignoreregex =
