# /etc/nginx/conf.d/rate-limit.conf — contexto http

# Origem permitida para responder o preflight CORS direto no nginx.
# Manter em sincronia com CORS_ALLOWED_ORIGINS (.env) e config/secure_cors.php.
map $http_origin $cors_origin {
    default "";
    "https://finance.coratri.com"     $http_origin;
    "https://www.finance.coratri.com" $http_origin;
}

limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=15r/s;
# Login: 20/min por IP (real_ip = cliente real atrás da Cloudflare). Brute-force
# continua coberto pelo throttle do Laravel + fail2ban. OPTIONS nem chega aqui
# (é respondido direto na location, antes do limit_req).
limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Respostas de rate limit usam 429 (retryable), não 503 (parece servidor caído).
limit_req_status 429;
limit_conn_status 429;
