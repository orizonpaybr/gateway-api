# /etc/nginx/conf.d/rate-limit.conf — contexto http

# Preflight CORS (OPTIONS) NUNCA pode ser rate-limited: se levar 503/429 o nginx
# responde sem header Access-Control-Allow-Origin e o browser mostra "Load failed".
# Para OPTIONS a chave fica vazia -> limit_req ignora a requisição.
map $request_method $login_rl_key {
    OPTIONS "";
    default $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=15r/s;
# Login: 20/min por IP (real_ip = cliente real atrás da Cloudflare). Brute-force
# continua coberto pelo throttle do Laravel + fail2ban. OPTIONS isento via map.
limit_req_zone $login_rl_key zone=login:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Respostas de rate limit usam 429 (retryable), não 503 (parece servidor caído).
limit_req_status 429;
limit_conn_status 429;
