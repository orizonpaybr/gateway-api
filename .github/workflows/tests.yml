# Esteira de testes: executa em todo push e em todo PR para main/master
# Garante que a base está estável antes de merge e antes de deploy
name: 🧪 Tests (CI)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PHP_VERSION: '8.2'
  DB_DATABASE: 'gateway_api_test'

jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gateway_api_test
          MYSQL_USER: gateway
          MYSQL_PASSWORD: 123456
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: php-${{ hashFiles('**/composer.lock') }}
          restore-keys: php-

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, bcmath, pdo_mysql, redis, gd, fileinfo, openssl, tokenizer, ctype, json
          coverage: none

      - name: 📦 Composer install
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: 🔐 Composer audit
        run: composer audit --no-interaction --abandoned=ignore

      - name: 📝 Env para testes
        run: |
          cp .env.example .env 2>/dev/null || cp env_example.txt .env 2>/dev/null || true
          php artisan key:generate

      - name: 🗄️ Migrate (test DB)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ${{ env.DB_DATABASE }}
          DB_USERNAME: gateway
          DB_PASSWORD: 123456
          APP_ENV: testing
        run: php artisan migrate --force

      - name: 🧪 PHPUnit (Unit + Feature)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ${{ env.DB_DATABASE }}
          DB_USERNAME: gateway
          DB_PASSWORD: 123456
          APP_ENV: testing
          APP_KEY: base64:iVoKOkyma32te1Ai0lq7UmR8RCCv3R9OsYAiAH8ZFMY=
          JWT_SECRET: test_jwt_secret_key_for_automated_tests_only_do_not_use_in_production
          CACHE_STORE: redis
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan test --testsuite=Pipeline --colors=always

  # Opcional: job de lint/estilo (descomente se usar PHP CS Fixer ou similar)
