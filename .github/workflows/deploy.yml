# Deploy: em push para main/master roda testes (uma vez) e depois deploy para produção.
# Testes em PR são feitos pelo workflow tests.yml.
name: Deploy to Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/run-tests.yml

  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          echo "Iniciando deploy..."
          ssh $SERVER_USER@$SERVER_HOST bash << EOF
            set -e
            cd $APP_DIR || exit 1

            echo "Fazendo pull do código..."
            git fetch origin
            git reset --hard HEAD
            git clean -fd
            git checkout main
            git reset --hard origin/main

            echo "Instalando dependências..."
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            echo "Configurando permissões..."
            sudo chown -R gateway:www-data $APP_DIR
            sudo chmod -R 775 storage bootstrap/cache

            echo "Executando migrations..."
            sudo -u gateway php artisan migrate --force

            echo "Limpando cache..."
            sudo -u gateway php artisan config:clear
            sudo -u gateway php artisan route:clear
            sudo -u gateway php artisan cache:clear

            echo "Otimizando para produção..."
            sudo -u gateway php artisan config:cache
            sudo -u gateway php artisan route:cache
            sudo -u gateway php artisan optimize

            echo "Reiniciando PHP-FPM..."
            sudo systemctl restart php8.2-fpm

            echo "Deploy concluído com sucesso!"
          EOF

      # Health check HTTPS: o certificado deve bater com o HOST da URL (SAN).
      # - Defina o secret HEALTH_CHECK_URL (ex.: https://api.coratri.com/up) — recomendado após troca de domínio (orizonpay → coratri).
      # - Se HEALTH_CHECK_URL estiver vazio, usa https://$SERVER_HOST/up — só funciona se SERVER_HOST for o mesmo FQDN do certificado (não use IP).
      - name: Health Check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          HEALTH_CHECK_URL: ${{ secrets.HEALTH_CHECK_URL }}
        run: |
          echo "Verificando saúde da aplicação..."
          sleep 5
          URL="${HEALTH_CHECK_URL:-https://$SERVER_HOST/up}"
          echo "URL do health check: $URL"
          if [ -z "${HEALTH_CHECK_URL:-}" ] && echo "$SERVER_HOST" | grep -qE '^[0-9.]+$|^\[.*\]$'; then
            echo "::warning::HEALTH_CHECK_URL não definido e SERVER_HOST parece IP. O TLS costuma falhar (curl 60). Configure o secret HEALTH_CHECK_URL com a URL pública HTTPS (ex.: https://api.coratri.com/up)."
          fi
          curl -f --connect-timeout 15 --max-time 20 "$URL" || exit 1
          echo "Aplicação está respondendo!"

      - name: Notify deployment
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "Deploy concluído com sucesso!"
          else
            echo "Deploy falhou!"
          fi
